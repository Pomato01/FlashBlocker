<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        padding: 16px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: #0f0f0f;
        color: #f1f1f1;
        margin: 0;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .title {
        font-size: 16px;
        font-weight: 700;
      }
      .toggle-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
        background: #272727;
        padding: 10px 12px;
        border-radius: 8px;
      }
      .switch {
        position: relative;
        display: inline-block;
        width: 38px;
        height: 22px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #444;
        transition: 0.2s;
        border-radius: 22px;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 16px;
        width: 16px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.2s;
        border-radius: 50%;
      }
      input:checked + .slider {
        background-color: #3ea6ff;
      }
      input:checked + .slider:before {
        transform: translateX(16px);
      }

      .section-label {
        font-size: 12px;
        color: #aaa;
        margin-bottom: 6px;
      }
      select {
        width: 100%;
        padding: 8px;
        background: #272727;
        border: 1px solid #3f3f3f;
        color: #fff;
        border-radius: 6px;
        margin-bottom: 16px;
        outline: none;
      }
      .stats-card {
        background: #1f1f1f;
        border: 1px solid #2d2d2d;
        border-radius: 8px;
        padding: 12px;
        text-align: center;
      }
      .stat-value {
        font-size: 24px;
        font-weight: 700;
        color: #3ea6ff;
      }
      .stat-label {
        font-size: 11px;
        color: #aaa;
        margin-top: 2px;
      }
      .status-badge {
        display: inline-block;
        margin-top: 8px;
        padding: 4px 8px;
        font-size: 11px;
        border-radius: 4px;
        font-weight: 600;
      }
      .safe {
        background: rgba(46, 125, 50, 0.3);
        color: #81c784;
      }
      .danger {
        background: rgba(198, 40, 40, 0.3);
        color: #e57373;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="title">FlashShield</div>
    </div>

    <div class="toggle-container">
      <span>Enable Protection</span>
      <label class="switch">
        <input type="checkbox" id="enabled-toggle" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="section-label">Sensitivity</div>
    <select id="sensitivity-select">
      <option value="low">Low (Fewer false positives)</option>
      <option value="medium">Medium (Recommended WCAG)</option>
      <option value="high">High (Maximum caution)</option>
    </select>

    <div class="stats-card">
      <div class="stat-value" id="flash-count">0</div>
      <div class="stat-label">Flashes / Sec</div>
      <div class="status-badge safe" id="status-badge">SAFE</div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
